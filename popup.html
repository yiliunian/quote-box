<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>QuoteBox</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <!-- 头部 -->
    <header class="popup-header">
      <div class="logo">
        <span class="logo-icon">📦</span>
        <span class="logo-text">QuoteBox</span>
      </div>
      <button id="open-manager" class="btn-icon" title="打开管理页面">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
          <polyline points="9 22 9 12 15 12 15 22"/>
        </svg>
      </button>
    </header>
    
    <!-- 主操作区 -->
    <main class="popup-main">
      <!-- 保存选中内容 -->
      <div class="action-section">
        <button id="save-selection" class="btn btn-primary btn-block">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/>
            <polyline points="17 21 17 13 7 13 7 21"/>
            <polyline points="7 3 7 8 15 8"/>
          </svg>
          保存选中内容
        </button>
        <p class="hint" id="selection-hint">请先在页面上选中要保存的文字或图片</p>
      </div>
      
      <!-- 分隔线 -->
      <div class="divider">
        <span>或</span>
      </div>
      
      <!-- 统计信息 -->
      <div class="stats-section">
        <div class="stat-item">
          <span class="stat-value" id="card-count">-</span>
          <span class="stat-label">卡片总数</span>
        </div>
        <div class="stat-item">
          <span class="stat-value" id="recent-count">-</span>
          <span class="stat-label">本周新增</span>
        </div>
      </div>
      
      <!-- 快速操作 -->
      <div class="quick-actions">
        <button id="export-btn" class="btn btn-secondary btn-block">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
            <polyline points="7 10 12 15 17 10"/>
            <line x1="12" y1="15" x2="12" y2="3"/>
          </svg>
          导出全部
        </button>
        <button id="import-btn" class="btn btn-secondary btn-block">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
            <polyline points="17 8 12 3 7 8"/>
            <line x1="12" y1="3" x2="12" y2="15"/>
          </svg>
          导入
        </button>
        <input type="file" id="import-file" accept=".json" style="display:none">
      </div>
    </main>
    
    <!-- 底部最近卡片 -->
    <footer class="popup-footer" id="recent-cards">
      <div class="footer-title">最近保存</div>
      <div class="recent-list" id="recent-list">
        <div class="empty-hint">暂无卡片</div>
      </div>
    </footer>
    
    <!-- 状态提示 -->
    <div id="status-message" class="status-message" style="display:none;"></div>
  </div>
  
  <script src="db.js"></script>
  <script src="popup.js"></script>
</body>
</html>
