<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QuoteBox - 我的收藏盒</title>
  <link rel="stylesheet" href="manager.css">
</head>
<body>
  <div class="app-container">
    <!-- 侧边栏 -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <div class="logo">
          <span class="logo-icon">📦</span>
          <span class="logo-text">QuoteBox</span>
        </div>
      </div>
      
      <div class="sidebar-stats">
        <div class="stat-card">
          <div class="stat-number" id="total-count">0</div>
          <div class="stat-label">卡片总数</div>
        </div>
      </div>
      
      <nav class="sidebar-nav">
        <button class="nav-item active" data-view="all">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="3" width="7" height="7"/>
            <rect x="14" y="3" width="7" height="7"/>
            <rect x="3" y="14" width="7" height="7"/>
            <rect x="14" y="14" width="7" height="7"/>
          </svg>
          <span>全部卡片</span>
        </button>
        <button class="nav-item" data-view="recent">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="10"/>
            <polyline points="12 6 12 12 16 14"/>
          </svg>
          <span>最近保存</span>
        </button>
      </nav>
      
      <div class="sidebar-footer">
        <div class="footer-section">
          <h4>数据管理</h4>
          <button class="footer-btn" id="export-all">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
              <polyline points="7 10 12 15 17 10"/>
              <line x1="12" y1="15" x2="12" y2="3"/>
            </svg>
            导出全部
          </button>
          <button class="footer-btn" id="import-data">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
              <polyline points="17 8 12 3 7 8"/>
              <line x1="12" y1="3" x2="12" y2="15"/>
            </svg>
            导入
          </button>
          <input type="file" id="import-file" accept=".json" style="display:none">
        </div>
      </div>
    </aside>
    
    <!-- 主内容区 -->
    <main class="main-content">
      <!-- 顶部搜索栏 -->
      <header class="content-header">
        <h1 id="view-title">全部卡片</h1>
        <div class="header-actions">
          <!-- 排序下拉选 -->
          <select id="sort-select" class="sort-select">
            <option value="time-desc">保存时间 ↓（新→旧）</option>
            <option value="time-asc">保存时间 ↑（旧→新）</option>
          </select>
          <div class="search-box">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="11" cy="11" r="8"/>
              <line x1="21" y1="21" x2="16.65" y2="16.65"/>
            </svg>
            <input type="text" id="search-input" placeholder="搜索卡片标题、内容、备注...">
          </div>
          <button class="btn-header danger" id="delete-selected" style="display:none">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <polyline points="3 6 5 6 21 6"/>
              <path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/>
            </svg>
            删除 <span id="delete-count" class="badge">0</span> 张
          </button>
          <button class="btn-header" id="export-selected" style="display:none">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
              <polyline points="7 10 12 15 17 10"/>
              <line x1="12" y1="15" x2="12" y2="3"/>
            </svg>
            导出选中 <span id="selected-count" class="badge">0</span> 张
          </button>
          <button class="btn-header ghost" id="clear-selection" style="display:none">取消全选</button>
        </div>
      </header>
      
      <!-- 卡片网格 -->
      <div class="cards-container" id="cards-container">
        <!-- 卡片将通过 JS 动态生成 -->
      </div>
      
      <!-- 空状态 -->
      <div class="empty-state" id="empty-state" style="display:none;">
        <div class="empty-icon">📭</div>
        <h3>还没有收藏任何内容</h3>
        <p>在任何网页上选中文字或图片，然后点击浏览器工具栏的 QuoteBox 图标保存</p>
        <p class="hint-text">或右键点击选中内容，选择"保存选中内容到 QuoteBox"</p>
      </div>
    </main>
    
    <!-- 详情面板（右侧抽屉） -->
    <div class="detail-panel" id="detail-panel">
      <div class="detail-header">
        <div class="detail-title-row">
          <h2 id="detail-title">卡片标题</h2>
          <button class="close-btn" id="close-detail">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <line x1="18" y1="6" x2="6" y2="18"/>
              <line x1="6" y1="6" x2="18" y2="18"/>
            </svg>
          </button>
        </div>
        <div class="detail-meta">
          <a id="detail-source" href="#" target="_blank" class="source-link">
            <img id="detail-favicon" class="favicon-small" src="" alt="">
            <span id="detail-source-text">来源链接</span>
          </a>
          <span class="detail-date" id="detail-date">保存于 2024-01-01</span>
        </div>
      </div>
      
      <div class="detail-content-wrapper">
        <div class="detail-content" id="detail-content">
          <!-- 卡片 HTML 内容将在这里渲染 -->
        </div>
      </div>
      
      <div class="detail-footer">
        <div class="note-section">
          <label>备注</label>
          <textarea id="detail-note" placeholder="添加备注说明..."></textarea>
        </div>
        <div class="detail-actions">
          <button class="action-btn" id="toggle-edit">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M12 20h9"/>
              <path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/>
            </svg>
            编辑内容
          </button>
          <button class="action-btn primary" id="save-edit" style="display:none">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/>
              <polyline points="17 21 17 13 7 13 7 21"/>
              <polyline points="7 3 7 8 15 8"/>
            </svg>
            保存修改
          </button>
          <button class="action-btn ghost" id="restore-edit" style="display:none">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <polyline points="1 4 1 10 7 10"/>
              <path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/>
            </svg>
            恢复原文
          </button>
          <button class="action-btn" id="copy-content">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="9" y="9" width="13" height="13" rx="2" ry="2"/>
              <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
            </svg>
            复制文本
          </button>
          <button class="action-btn danger" id="delete-card">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <polyline points="3 6 5 6 21 6"/>
              <path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/>
              <path d="M10 11v6M14 11v6"/>
            </svg>
            删除
          </button>
        </div>
      </div>
    </div>
    
    <!-- 遮罩层 -->
    <div class="overlay" id="overlay" style="display:none;"></div>
  </div>
  
  <!-- Toast 通知 -->
  <div id="toast" class="toast" style="display:none;"></div>
  
  <script src="db.js"></script>
  <script src="manager.js"></script>
</body>
</html>
